<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Плейлисты и события</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="top">
    <span class="status-line" id="statusLine">не подключено</span>
  </header>

  <main class="shell">
    <section class="connect" id="connectPanel">
      <h1>Подключение</h1>
      <p class="lede">REST Carrot или значения из <code>.env</code>.</p>
      <form id="connectForm" class="connect-form" autocomplete="off">
        <label>
          <span>Base URL</span>
          <input id="baseUrl" name="baseUrl" type="url" placeholder="http://172.17.97.71:5001" />
        </label>
        <label>
          <span>Login</span>
          <input id="login" name="login" type="text" autocomplete="username" />
        </label>
        <label>
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </label>
        <button type="submit" class="btn primary" id="connectBtn">Подключить</button>
      </form>
    </section>

    <section class="workspace" id="workspace" hidden>
      <aside class="playlists-pane">
        <div class="pane-head pane-head-compact">
          <button type="button" class="btn ghost" id="reloadPlaylists"
            title="Заново загрузить плейлисты и текущий список событий с сервера">
            Обновить с сервера
          </button>
        </div>
        <ul class="playlist-list" id="playlistList"></ul>
        <p class="empty" id="playlistEmpty" hidden>Плейлистов нет</p>
      </aside>

      <section class="events-pane">
        <div class="pane-head">
          <div>
            <h2 id="eventsTitle">События</h2>
            <p class="lede" id="eventsHint">Выбери «Все события» или плейлист слева</p>
          </div>
          <div class="pane-actions">
            <details class="cols-menu" id="colsMenu">
              <summary class="btn ghost">Колонки</summary>
              <div class="cols-menu-body" id="colsMenuBody"></div>
            </details>
            <input type="search" id="filterInput" class="filter" placeholder="Фильтр…" disabled />
            <button type="button" class="btn danger" id="deleteBtn" disabled>Удалить</button>
          </div>
        </div>

        <div class="table-wrap" id="tableWrap">
          <table class="events-table" id="eventsTable" hidden>
            <thead id="eventsHead"></thead>
            <tbody id="eventsBody"></tbody>
          </table>
          <p class="empty" id="eventsEmpty">Выбери «Все события» или плейлист слева</p>
        </div>

        <aside class="editor" id="editorPanel" hidden>
          <div class="editor-head">
            <div class="editor-head-text">
              <h3 id="editorTitle">Переменные</h3>
              <p class="editor-sub" id="editorSub" hidden></p>
            </div>
            <div class="editor-head-actions">
              <input type="search" id="varFilter" class="filter filter-sm" placeholder="Фильтр переменных…" hidden />
              <button type="button" class="btn ghost sm" id="editorCollapseAll" hidden>Свернуть все</button>
            </div>
          </div>
          <div class="editor-tabs" id="editorTabs" hidden></div>
          <div class="editor-body" id="editorBody"></div>
        </aside>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" hidden role="status"></div>

  <dialog id="confirmDialog">
    <form method="dialog" class="confirm-box">
      <h3>Удалить выбранные события?</h3>
      <p id="confirmText"></p>
      <div class="confirm-actions">
        <button value="cancel" class="btn ghost">Отмена</button>
        <button value="ok" class="btn danger">Удалить</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
